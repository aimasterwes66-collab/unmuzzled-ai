  <line class="link" x1="510" y1="380" x2="1090" y2="330"/>
  <text class="legend" x="770" y="330" fill="#00ff88">A2A /message:send</text>
  <line class="link" x1="510" y1="520" x2="1090" y2="720"/>
  <text class="legend" x="770" y="640" fill="#00ff88">A2A JSON-RPC</text>
  <line class="link-down" x1="1200" y1="430" x2="1200" y2="620"/>
