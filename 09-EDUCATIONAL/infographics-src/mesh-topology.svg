  <line class="link" stroke-dasharray="4,6" x1="500" y1="500" x2="620" y2="510"/>
  <line class="link" stroke-dasharray="4,6" x1="980" y1="490" x2="1100" y2="380"/>
  <line class="link" stroke-dasharray="4,6" x1="980" y1="600" x2="1100" y2="700"/>

  <text class="legend" x="60" y="1010">legend: solid green = A2A live · red dashed = A2A down / bus-only · yellow dotted = planned</text>
  <text class="legend" x="60" y="1035">rule: no agent on ACE (this box) may be named HERM or WORM · identity-per-device is invariant</text>
  <text class="legend" x="60" y="1060">tokens: ~/.hermes/.env A2A_BEARER_TOKEN + per-name HMAC-SHA256 in A2A_PEER_TOKENS</text>
