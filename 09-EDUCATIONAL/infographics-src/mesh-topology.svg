<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="'JetBrains Mono',monospace">
  <style><![CDATA[
    .bg{fill:#0a0a0a}
    .title{fill:#00ff88;font-size:38px;font-weight:700}
    .sub{fill:#7a7a7a;font-size:16px}
    .node{fill:#111;stroke:#00ff88;stroke-width:3}
    .node-down{fill:#111;stroke:#ff3355;stroke-width:3;stroke-dasharray:6,4}
